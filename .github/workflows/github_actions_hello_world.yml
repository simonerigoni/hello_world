name: GitHub Actions Hello World
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Name to say hello to'
        required: false
        default: 'World'
        type: string

permissions:
  contents: read

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Announce trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: echo "🎉 The job was automatically triggered by a $EVENT_NAME event."
      - name: Announce runner
        env:
          RUNNER_OS: ${{ runner.os }}
        run: echo "🐧 This job is now running on a $RUNNER_OS server hosted by GitHub!"
      - name: Announce branch and repository
        env:
          BRANCH_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: echo "🔎 The name of your branch is $BRANCH_REF and your repository is $REPOSITORY."
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Say hello after checkout
        env:
          HELLO_NAME: ${{ inputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: echo "💡 Hello $HELLO_NAME! The $REPOSITORY repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        env:
          WORKSPACE_PATH: ${{ github.workspace }}
        run: ls "$WORKSPACE_PATH"
      - name: Announce job status
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "🍏 This job's status is $JOB_STATUS."
