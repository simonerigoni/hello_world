[project]
name = "python-package-hello-world"
version = "0.1.0"
description = "A simple Hello World Python package built and run with uv"
readme = "README.md"
authors = [{ name = "Simone Rigoni" }]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
python-package-hello-world = "python_package_hello_world:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
